<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная №5 — Введение в Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #ddd;
      border-radius: 5px;
      cursor: pointer;
    }
    button.active {
      background: #42b883;
      color: white;
    }
    .task {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      margin-top: 8px;
      padding: 6px;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Лабораторная №5 — Введение в Vue</h1>

  <div class="tabs">
    <button
      v-for="(tab, i) in tabs"
      :key="i"
      :class="{ active: currentTab === i }"
      @click="currentTab = i"
    >
      Задание {{ i + 1 }}
    </button>
  </div>

  <div class="task">
    <component :is="tabs[currentTab]"></component>
  </div>
</div>

<script>
  const { createApp, ref, computed, watch, onMounted, defineComponent } = Vue;

  // Задание 1
  const Task1 = defineComponent({
    setup() {
      const name = ref('Пользователь');
      return { name };
    },
    template: `
      <div>
        <h2>Привет, Vue!</h2>
        <input v-model="name" placeholder="Введите имя">
        <p>Привет, {{ name }}!</p>
      </div>
    `
  });

  // Задание 2
  const Task2 = defineComponent({
    setup() {
      const counter = ref(0);
      const increment = () => counter.value++;
      return { counter, increment };
    },
    template: `
      <div>
        <h2>Реактивный счётчик</h2>
        <div class="counter">{{ counter }}</div>
        <button @click="increment">Увеличить</button>
      </div>
    `
  });

  // Задание 3
  const Task3 = defineComponent({
    setup() {
      const showDescription = ref(false);
      const toggle = () => showDescription.value = !showDescription.value;
      return { showDescription, toggle };
    },
    template: `
      <div>
        <h2>Условный рендеринг</h2>
        <button @click="toggle">{{ showDescription ? 'Скрыть' : 'Показать' }} описание</button>
        <div v-if="showDescription" class="description">
          Это описание можно показать или скрыть
        </div>
      </div>
    `
  });

  // Задание 4
  const Task4 = defineComponent({
    setup() {
      const tasks = ref(['Изучить Vue', 'Создать приложение', 'Развернуть проект']);
      return { tasks };
    },
    template: `
      <div>
        <h2>Список элементов</h2>
        <ul>
          <li v-for="(task, index) in tasks" :key="index">
            {{ index + 1 }}. {{ task }}
          </li>
        </ul>
      </div>
    `
  });

  // Задание 5
  const Task5 = defineComponent({
    setup() {
      const newUser = ref({ name: '', age: '' });
      const users = ref([]);
      const addUser = () => {
        if (newUser.value.name && newUser.value.age) {
          users.value.push({ ...newUser.value });
          newUser.value = { name: '', age: '' };
        }
      };
      return { newUser, users, addUser };
    },
    template: `
      <div>
        <h2>Мини-форма</h2>
        <input v-model="newUser.name" placeholder="Имя">
        <input v-model.number="newUser.age" type="number" placeholder="Возраст">
        <button @click="addUser">Добавить</button>
        <div v-for="(user, index) in users" :key="index" class="user-card">
          {{ user.name }}, {{ user.age }} лет
        </div>
      </div>
    `
  });

  // Задание 6
  const Task6 = defineComponent({
    setup() {
      const number = ref(0);
      const squared = computed(() => number.value * number.value);
      const cubed = computed(() => number.value * number.value * number.value);
      return { number, squared, cubed };
    },
    template: `
      <div>
        <h2>Вычисляемые свойства</h2>
        <input v-model.number="number" type="number" placeholder="Число">
        <p>Число: {{ number }}</p>
        <p>Квадрат: {{ squared }}</p>
        <p>Куб: {{ cubed }}</p>
      </div>
    `
  });

  // Задание 7
  const Task7 = defineComponent({
    setup() {
      const currentTime = ref('');
      const greeting = ref('');
      
      const updateTime = () => {
        const now = new Date();
        currentTime.value = now.toLocaleTimeString();
        const hour = now.getHours();
        greeting.value = hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
      };
      
      watch(currentTime, (newTime) => {
        console.log('Время обновлено:', newTime);
      });
      
      onMounted(() => {
        updateTime();
        setInterval(updateTime, 1000);
      });
      
      return { currentTime, greeting };
    },
    template: `
      <div>
        <h2>Watch и жизненный цикл</h2>
        <div class="time-display">Время: {{ currentTime }}</div>
        <div class="greeting">{{ greeting }}</div>
        <p><small>Смотрите консоль для логов</small></p>
      </div>
    `
  });

  createApp({
    setup() {
      const currentTab = ref(0);
      const tabs = [Task1, Task2, Task3, Task4, Task5, Task6, Task7];
      return { currentTab, tabs };
    }
  }).mount('#app');
</script>
</body>
</html>
